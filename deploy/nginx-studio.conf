# 部署到 /etc/nginx/conf.d/studio.conf
#
# 这份配置走纯 HTTP 8080(无域名 IP 直访方案)。
# 后面绑了域名要加 SSL,把这份改成 listen 443 ssl + server_name 你的域名,
# certbot --nginx 自动改。
#
# 依赖:
#   - we-mp-rss 跑在 127.0.0.1:8001
#   - content-studio-api (Express) 跑在 127.0.0.1:5174
#   - 前端 build 产物在 /var/www/studio/
#
# 安全组:阿里云 / 腾讯云控制台需放行 TCP 8080
#
# 加完执行:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8080;
    server_name _;

    client_max_body_size 10M;

    # ---------- 前端静态 ----------
    root /var/www/studio;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- content-studio Express ----------
    location /studio/ {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ---------- we-mp-rss API + WebSocket ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    # ---------- we-mp-rss 自己的 feed / views / static ----------
    location ~ ^/(feed|views|static)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_min_length 1024;
}
